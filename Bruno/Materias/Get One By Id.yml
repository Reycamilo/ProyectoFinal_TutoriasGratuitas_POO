docs: |-
  
  ## Endpoint: Obtener una materia por Id

  Este endpoint permite buscar una materia específica usando su identificador único.

  ### URL
  ```http
  GET /api/materia/{id}
  ```

  ### Descripción
  Busca una materia en la base de datos a partir de su `Id`.

  La respuesta devuelve la información de la materia usando el mismo DTO de salida del endpoint de listar todas las materias. Esto significa que también incluye solamente los nombres de los tutores asociados.

  ### Parámetro en la URL
  - `id`: identificador único de la materia.

  ### Ejemplo de solicitud
  ```http
  GET /api/materia/8f3d2a1b-45c7-4d9f-a123-98f23b4c5678
  ```

  ### Respuesta exitosa
  Si la materia existe, el endpoint responde con:

  ```http
  200 OK
  ```

  ```json
  {
    "codigo": "MAT101",
    "nombre": "Matematica Basica",
    "area": "Ciencias",
    "creditos": 4,
    "tutores": [
      "Juan",
      "Maria"
    ]
  }
  ```

  ### Respuesta cuando la materia no existe
  Si no existe una materia con el `Id` enviado, el endpoint responde con:

  ```http
  404 Not Found
  ```

  ```json
  "No existe una materia con ese Id."
  ```

  ### Resumen
  Este endpoint se utiliza para consultar una materia específica por su identificador, mostrando sus datos principales y los nombres de los tutores relacionados.
