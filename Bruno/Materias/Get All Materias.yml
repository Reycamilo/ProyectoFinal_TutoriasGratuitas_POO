info:
  name: Get All Materias
  type: http
  seq: 1

http:
  method: GET
  url: "{{Local_Path}}/api/materia"
  auth: inherit

runtime:
  variables:
    - name: Local_Path
      value: http://localhost:5294

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Endpoint: Obtener todas las materias

  Este endpoint permite consultar todas las materias registradas en el sistema.

  ### URL
  ```http
  GET /api/materia
  ```

  ### Descripción
  Recupera la lista completa de materias almacenadas en la base de datos.

  La respuesta utiliza un DTO de salida para mostrar únicamente la información necesaria de cada materia. En lugar de devolver todos los datos de los tutores relacionados, solo devuelve una lista con los nombres de los tutores asociados a cada materia.

  ### Cuerpo de la petición
  Este endpoint no requiere cuerpo en la solicitud.

  ### Respuesta exitosa
  Si la consulta se realiza correctamente, el endpoint responde con:

  ```http
  200 OK
  ```

  ```json
  [
    {
      "codigo": "MAT101",
      "nombre": "Matematica Basica",
      "area": "Ciencias",
      "creditos": 4,
      "tutores": [
        "Juan",
        "Maria"
      ]
    },
    {
      "codigo": "ESP201",
      "nombre": "Espanol General",
      "area": "Humanidades",
      "creditos": 3,
      "tutores": []
    }
  ]
  ```

  ### Campos de la respuesta
  - `codigo`: código de la materia.
  - `nombre`: nombre de la materia.
  - `area`: área académica de la materia.
  - `creditos`: cantidad de créditos.
  - `tutores`: lista con los nombres de los tutores asignados a esa materia.

  ### Resumen
  Este endpoint se utiliza para obtener todas las materias registradas en el sistema, mostrando también los nombres de los tutores asociados a cada una.
