docs: |-
  ## Endpoint: Crear un nuevo tutor

  Este endpoint permite registrar un nuevo tutor en el sistema y asignarle una materia existente por medio del código de la clase enviado en la URL.

  ### URL
  ```http
  POST /api/tutor/
  ```

  ### Descripción
  Recibe los datos de un tutor en el cuerpo de la petición.

  Antes de crear el tutor, el sistema realiza dos validaciones:
  - Verifica que exista una materia con el código recibido.
  - Verifica que no exista otro tutor con el mismo DNI.

  Si ambas validaciones se cumplen, el sistema crea el tutor y le asigna automáticamente el `MateriaId` correspondiente a la materia encontrada.


  ### Cuerpo de la petición
  Se debe enviar un objeto JSON con la siguiente estructura:

  ```json
  {
    "dni": "0801199901234",
    "nombre": "Juan",
    "apellido": "Perez",
    "fechaDeNacimiento": "2000-05-15T00:00:00",
    "correoElectronico": "juan.perez@email.com",
    "genero": "Masculino"
    "codigoMateria": "F100"
  }
  ```

  ### Campos
  - `dni`: número de identidad del tutor.
  - `nombre`: nombres del tutor.
  - `apellido`: apellidos del tutor.
  - `fechaDeNacimiento`: fecha de nacimiento del tutor.
  - `correoElectronico`: correo electrónico del tutor.
  - `genero`: género del tutor.
  - `codigoMateria` (opcional): Id de la materia asociada al tutor.


  ### Ejemplo de solicitud
  ```http
  POST /api/tutor
  ```

  ```json
  {
    "dni": "0801199901234",
    "nombre": "Juan",
    "apellido": "Perez",
    "fechaDeNacimiento": "2000-05-15T00:00:00",
    "correoElectronico": "juan.perez@email.com",
    "genero": "Masculino"
    "codigoMateria": "F100"
  }
  ```

  ### Respuesta exitosa
  Si el tutor se crea correctamente, el endpoint responde con:

  ```http
  200 OK
  ```

  ```json
  "Tutor creado exitosamente."
  ```

  ### Respuesta cuando la materia no existe
  Si el código de materia enviado no está registrado en la base de datos, el endpoint responde con:

  ```http
  409 Conflict
  ```

  ```json
  "No existe una materia con ese codigo."
  ```

  ### Respuesta cuando ya existe un tutor con el mismo DNI
  Si ya existe un tutor registrado con el mismo DNI, el endpoint responde con:

  ```http
  409 Conflict
  ```

  ```json
  "Ya existe un tutor con ese dni."
  ```

  ### Resumen
  Este endpoint se utiliza para registrar tutores nuevos en el sistema, asegurando que la materia asignada exista y que no se repita el DNI de otro tutor ya registrado.
