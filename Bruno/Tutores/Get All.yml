info:
  name: Get All
  type: http
  seq: 1

http:
  method: GET
  url: "{{Local_Path}}/api/tutor"
  auth: inherit

runtime:
  variables:
    - name: Local_Path
      value: http://localhost:5294

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ## Endpoint: Obtener todos los tutores

  Este endpoint permite consultar todos los tutores registrados en el sistema.

  ### URL
  ```http
  GET /api/tutor
  ```

  ### Descripción
  Recupera la lista completa de tutores almacenados en la base de datos.

  Además, cada tutor incluye la información de la materia asociada, lo que permite conocer qué materia imparte o domina cada tutor.

  ### Cuerpo de la petición
  Este endpoint no requiere cuerpo en la solicitud.

  ### Respuesta exitosa
  Si la consulta se realiza correctamente, el endpoint responde con:

  ```http
  200 OK
  ```

  ```json
  [
    {
      "dni": "1234567891232",
      "nombre": "Kevin",
      "apellido": "Maldonado",
      "fechaDeNacimiento": "2004-02-12T00:00:00",
      "correoElectronico": "salguero@gmail.com",
      "genero": "M",
      "materia": "Fisica 1"
    }
  ]
  ```

  ### Campos de la respuesta
  - `dni`: número de identidad del tutor.
  - `nombre`: nombres del tutor.
  - `apellido`: apellidos del tutor.
  - `fechaDeNacimiento`: fecha de nacimiento del tutor.
  - `correoElectronico`: correo electrónico del tutor.
  - `genero`: género del tutor.
  - `materia`: información de la materia asociada al tutor.

  ### Resumen
  Este endpoint se utiliza para obtener todos los tutores registrados en el sistema junto con la materia relacionada a cada uno.
